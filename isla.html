<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>La Isla de Todos · La isla en directo</title>
<meta name="description" content="La isla de La Isla de Todos en directo: muévete por ella y toca cada edificio para ver de quién es.">
<meta property="og:title" content="La Isla de Todos · La isla en directo">
<meta property="og:image" content="foto_perfil.png">
<link rel="icon" href="foto_perfil.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@700&display=swap">
<style>
:root{--sea:#0B4A66;--paper:#FFF8EA;--edge:#E6D3AE;--ink:#10263A;--muted:#6B5B45;--yellow:#FFC83D;--red:#C8233A;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);font-family:"Rubik",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.bar{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{pointer-events:auto;background:var(--yellow);color:var(--ink);font-weight:900;font-size:14px;letter-spacing:.04em;padding:7px 12px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stat{pointer-events:auto;background:var(--paper);border-radius:10px;padding:6px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:16px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
a.btn{pointer-events:auto;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:9px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
a.btn:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 28px));
  background:var(--paper);border-radius:18px;padding:16px 18px;box-shadow:0 14px 40px rgba(0,0,0,.4);box-sizing:border-box}
.card::after{content:"";position:absolute;inset:7px;border:2px solid var(--edge);border-radius:12px;pointer-events:none}
.card .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .title{font-size:22px;font-weight:900;margin:2px 0 4px;overflow-wrap:anywhere}
.card .who{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--red);overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:14px;margin-top:4px}
.card button{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;width:44px;height:44px;z-index:1}
.rot{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:3}
.rot button{width:46px;height:46px;border-radius:12px;border:0;background:var(--paper);color:var(--ink);font-size:24px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.hint{position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));color:#D5EEF3;font-size:13px;text-align:left;width:calc(100vw - 150px);pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Mapa de la isla. Arrastra para moverte, pellizca o usa la rueda para acercar y toca un edificio para ver de quién es."></canvas>
<div class="bar">
  <span class="chip" id="dia">DÍA 1</span>
  <span class="stat"><b id="hab">0</b> habitantes</span>
  <span class="stat"><b id="cons">0</b> construcciones</span>
  <span class="spacer"></span>
  <a class="btn" href="./">Buscarme en la lista</a>
</div>
<div class="rot"><button type="button" aria-label="Girar a la izquierda" onclick="girar(-1)">⟲</button><button type="button" aria-label="Girar a la derecha" onclick="girar(1)">⟳</button></div>
<div class="hint" id="hint">Arrastra para moverte · clic derecho o ⟲ ⟳ para girar · toca un edificio</div>
<div class="card" id="card" hidden>
  <button id="close" aria-label="Cerrar">×</button>
  <div class="eyebrow" id="cEyebrow"></div>
  <div class="title" id="cTitle"></div>
  <div class="who" id="cWho"></div>
  <div class="meta" id="cMeta"></div>
</div>
<script src="isla-lib.js?v=1794062095"></script>
<script src="isla-extras.js?v=1794163935"></script>
<script>
'use strict';
const SEED = 1.7;
let ISLA = { dia: 1, habitantes: 0, construcciones: [] };
let R = 1.45, slots = [], objs = [], people = [], selected = null;
const dpr = Math.min(2, window.devicePixelRatio || 1);

// radio de la isla según habitantes (igual que los hitos de los vídeos)
function radioPara(h) {
  const pts = [[0, 1.45], [100, 2.8], [1000, 4.4], [10000, 6.5], [100000, 9.0]];
  if (h <= 0) return 1.45;
  for (let i = 1; i < pts.length; i++) if (h <= pts[i][0]) {
    const [h0, r0] = pts[i - 1], [h1, r1] = pts[i];
    const f = (Math.log10(Math.max(1, h)) - Math.log10(Math.max(1, h0))) / (Math.log10(h1) - Math.log10(Math.max(1, h0)));
    return r0 + (r1 - r0) * clamp(f);
  }
  return 9.0;
}
// huecos para edificar, del centro hacia fuera (plaza con palmera y calle al muelle libres)
function huecos(R) {
  const out = [];
  for (let i = -12; i <= 12; i++) for (let j = -12; j <= 12; j++) {
    const x = i * 0.85 + (h2(i, j, 1) - 0.5) * 0.12, y = j * 0.85 + (h2(i, j, 2) - 0.5) * 0.12;
    const r = Math.hypot(x, y); if (r < 0.75) continue;
    if (Math.abs(x) < 0.5 && y > 0.3) continue;
    const th = Math.atan2(y, x); if (r > islandR(th, R, SEED) - 0.45) continue;
    out.push({ x, y, r: r + h2(i, j, 3) * 0.3 });
  }
  return out.sort((a, b) => a.r - b.r);
}
let PLAN = null;
function construir() {
  // la ciudad se reparte sola por zonas (igual que en los vídeos): negocios, dos barrios de casas y barrio básico
  const items = (ISLA.construcciones || []).map(c => ({ ...c, forma: c.forma || (c.tipo === 'negocio' ? 'tienda' : 'casa'), data: c }));
  PLAN = planCiudad(items, ISLA.basicas || 0, SEED);
  R = PLAN.SR;
  const zf = (x, y) => SOLO_ARENA() ? Z_SAND : groundZ(x, y, R, SEED);
  objs = PLAN.items.map(it => ({ ox: it.x, oy: it.y, oface: it.face, ang: it.ang, x: it.x, y: it.y, face: it.face, type: 'custom', data: it.data, z: zf(it.x, it.y) }));
  PLAN.basics.forEach(b => objs.push({ ox: b.x, oy: b.y, oface: b.face, x: b.x, y: b.y, face: b.face, type: 'basic', data: { tipo: 'casa', basica: true, nombre: 'Casa básica', detalle: 'de un habitante que aún no ha comentado' }, z: zf(b.x, b.y) }));
  const n = Math.min(40, Math.max(2, Math.round((ISLA.habitantes || 0) / 3)));
  people = Array.from({ length: n }, (_, k) => ({ a: h2(k, 1, 4) * 6.28, r: 0.4 + h2(k, 2, 4) * (R - 0.6), sp: 0.05 + h2(k, 3, 4) * 0.08, col: SHIRTS[k % SHIRTS.length] }));
  document.getElementById('dia').textContent = 'DÍA ' + (ISLA.dia || 1);
  document.getElementById('hab').textContent = fmt(ISLA.habitantes || 0);
  document.getElementById('cons').textContent = fmt((ISLA.construcciones || []).length + (ISLA.basicas || 0));
}
// hasta los 100 habitantes la isla es solo arena (la hierba llega con el hito)
const SOLO_ARENA = () => (ISLA.habitantes || 0) < 100;
function dibujarEdificio(o, t) {
  if (o.type === 'basic') return drawBasic(o, o.z);
  const c = o.data, forma = c.forma || (c.tipo === 'negocio' ? 'tienda' : 'casa');
  drawCustom({ ...c, x: o.x, y: o.y, face: o.face, ang: (o.ang || 0) + VIEW_ROT * Math.PI / 2, forma, color: c.color || o.roof || o.col }, forma === 'puerto' ? Z_SAND : o.z, t);
}
function dibujarDetalle(o, t, push) {
  const det = o.data.detalles || (o.data.dibujo_detalle ? [o.data.dibujo_detalle] : []); if (det.length) return drawDetails({ x: o.x, y: o.y, face: o.face, det, forma: o.data.forma }, o.z, t, push);
  const d = null, z = o.z; if (!d) return;
  if (d === 'gato') drawCat(o.x - 0.15, o.y + 0.5, z, t, 1.2);
  if (d === 'gatos') { drawCat(o.x + 0.45, o.y - 0.12, z, t, 1.25, '#4A4A4A'); drawCat(o.x + 0.45, o.y + 0.18, z, t + 1, 1.25); }
  if (d === 'cobaya') drawCobaya(o.x + 0.5, o.y + 0.2, z, t, 1.4);
  if (d === 'peru') drawFlagPeru(o.x + 0.2, o.y, z + 0.7, t);
}

// cámara
cam.x = 0; cam.y = 0.2; cam.zoom = 1;
function encuadre() {
  if (!CITY) { cam.u = Math.min(W / (R * 2.83 + 1.4), H / (R * 1.6 + 3)); return; }
  // encuadra la forma real de la isla (proyección isométrica: horizontal x−y, vertical (x+y)/2)
  const N = CITY.shape.length; let a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9, mx = 0, my = 0;
  for (let i = 0; i < N; i++) { const th = i / N * 2 * Math.PI, r = islandR(th, CITY.SR, SEED), x = Math.cos(th) * r, y = Math.sin(th) * r; a0 = Math.min(a0, x - y); a1 = Math.max(a1, x - y); b0 = Math.min(b0, (x + y) / 2); b1 = Math.max(b1, (x + y) / 2); }
  const cxw = (a1 + a0) / 2, cyw = (b1 + b0); cam.x = (cxw + cyw) / 2; cam.y = (cyw - cxw) / 2;
  cam.u = Math.min(W / ((a1 - a0) + 0.6), H / ((b1 - b0) + 1.6));
}
function resize() {
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  cv.width = W; cv.height = H; cam.cx = W / 2; cam.cy = H * 0.54; encuadre();
}
addEventListener('resize', resize);

function frame(ts) {
  const t = ts / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSea(t, R); drawShore(R, SEED, t); if (SOLO_ARENA()) extrude(islandPts(R, SEED), 0, Z_SAND, C.sand, C.sandSide); else drawIsland(R, SEED);
  const rc = islandR(Math.PI / 2, R, SEED);
  const rc0 = isR0(Math.PI / 2, R);
  const fsc = ferryScale(Math.max(ISLA.nuevos_hoy || 0, ISLA.ferry_max_nuevos || 0));   // el ferry solo crece, nunca encoge
  if (PLAN) drawCityGround(PLAN, (x, y) => SOLO_ARENA() ? Z_SAND : groundZ(x, y, R, SEED));
  const list = [{ d: -0.75, f: () => drawObj({ type: 'palm', x: 0, y: 0, s: 1.1, z: SOLO_ARENA() ? Z_SAND : groundZ(0, 0, R, SEED) }, t, R, SEED) }];
  if (PLAN) drawParks(PLAN, (x, y) => SOLO_ARENA() ? Z_SAND : groundZ(x, y, R, SEED), (d, f) => list.push({ d, f }));
  for (const o of objs) { list.push({ d: o.x + o.y, f: () => dibujarEdificio(o, t) }); if (o.data.dibujo_detalle || o.data.detalles) dibujarDetalle(o, t, (d, f) => list.push({ d, f })); }
  people.forEach((p, k) => {
    if (k >= 12) return;
    const a = p.a + t * p.sp, r = p.r * (0.85 + 0.15 * Math.sin(t * 0.3 + k));
    let x = Math.cos(a) * r, y = Math.sin(a) * r;
    const th = Math.atan2(y, x), lim = islandR(th, R, SEED) - 0.3; if (Math.hypot(x, y) > lim) { x *= lim / Math.hypot(x, y); y *= lim / Math.hypot(x, y); }
    list.push({ d: x + y + 0.01, f: () => drawPerson(x, y, groundZ(x, y, R, SEED), p.col, t, 1.1, t * 8 + k) });
  });
  if (VIEW_ROT % 4 === 0) { const [fx, fy] = ferryXY(rc0, fsc); list.push({ d: fx + fy - 0.3, f: () => drawFerryS(fx, fy, Math.sin(t * 2.2) * 0.015, t, fsc) }); }
  { const [px0, py0] = rotXY(0, rc0 + 1.6); list.push({ d: px0 + py0, f: () => drawPierR(rc0, Z_SAND, pierLen(fsc)) }); }
  // nombres integrados: una placa pequeña clavada delante del edificio (se lee al acercar; no tapa nada)
  for (const o of objs) if (o.data.usuario) list.push({ d: o.x + o.y + 0.42, f: () => placa(o) });
  list.sort((a, b) => a.d - b.d); for (const o of list) o.f();
  if (selected && !selected.data.usuario) { const [sx, sy] = P(selected.x, selected.y, selected.z); tag(sx, sy - 0.75 * U(), '●', { t, px: 18, bg: '#FFFFFF' }); }
  requestAnimationFrame(frame);
}

function placa(o) {
  const fm = o.data.forma, u = U();
  const px = fm === 'puerto' ? o.x - 0.35 : o.x - 0.12, py = fm === 'puerto' ? o.y - 0.55 : o.y + 0.42;
  const [bx, by] = P(px, py, o.z); const fs = u * 0.075, sel = o === selected;
  ctx.fillStyle = C.woodDark; ctx.fillRect(bx - Math.max(1, u * 0.008), by - u * 0.16, Math.max(2, u * 0.016), u * 0.16);
  if (fs < 8 && !sel) { rrect(bx - u * 0.07, by - u * 0.24, u * 0.14, u * 0.09, u * 0.02, C.yellow, C.navy, Math.max(1, u * 0.008)); return; }
  const f = F('IDBlack', Math.max(8, fs)); ctx.font = f; const tw = ctx.measureText(o.data.usuario).width + u * 0.06, th = Math.max(8, fs) * 1.45;
  rrect(bx - tw / 2, by - u * 0.15 - th, tw, th, th * 0.3, sel ? '#FFFFFF' : C.yellow, C.navy, Math.max(1, u * 0.01));
  txt(o.data.usuario, bx, by - u * 0.15 - th * 0.3, f, C.navy);
}

// interacción: arrastrar, pellizcar, rueda, tocar
const ptrs = new Map(); let moved = 0, pinch0 = null;
function screenDelta(dx, dy) { const u = U(); const a = dx / u, b = dy / (u * 0.5); return [(a + b) / 2, (b - a) / 2]; }
// girar la vista (clic derecho y arrastrar, o los botones ⟲ ⟳)
function aplicarGiro() { const zf = (x, y) => SOLO_ARENA() ? Z_SAND : groundZ(x, y, R, SEED);
  for (const o of objs) { [o.x, o.y] = rotXY(o.ox, o.oy); o.face = rotFace(o.oface); o.z = zf(o.x, o.y); } encuadre(); }
function girar(k) { VIEW_ROT = (VIEW_ROT + k + 4) % 4; aplicarGiro(); }
let rotDrag = null;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { if (e.button === 2) { rotDrag = { x: e.clientX }; cv.setPointerCapture(e.pointerId); document.getElementById('hint').hidden = true; return; }
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; document.getElementById('hint').hidden = true; });
cv.addEventListener('pointermove', e => { if (!rotDrag) return; const dx = e.clientX - rotDrag.x; if (Math.abs(dx) > 90) { girar(dx > 0 ? 1 : -1); rotDrag.x = e.clientX; } });
cv.addEventListener('pointerup', e => { if (e.button === 2) rotDrag = null; });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = (e.clientX - p.x) * dpr, dy = (e.clientY - p.y) * dpr;
  if (ptrs.size === 1) { const [wx, wy] = screenDelta(dx, dy); cam.x -= wx; cam.y -= wy; moved += Math.abs(dx) + Math.abs(dy); }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) cam.zoom = clamp(cam.zoom * d / pinch0, 0.5, 4); pinch0 = d; moved = 99;
  }
});
function up(e) {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
  if (moved < 8 && e.type === 'pointerup') pick(e.clientX * dpr, e.clientY * dpr);
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0015), 0.5, 4); }, { passive: false });

function pick(sx, sy) {
  let best = null, bd = 1e9;
  for (const o of objs) { const [px, py] = P(o.x, o.y, o.z + 0.3); const d = Math.hypot(px - sx, py - sy); if (d < bd) { bd = d; best = o; } }
  if (best && bd < U() * 0.55) show(best); else hide();
}
function show(o) {
  selected = o; const c = o.data;
  document.getElementById('cEyebrow').textContent = c.tipo === 'negocio' ? 'Negocio' : 'Casa';
  const extra = c.detalle ? ' · ' + c.detalle : '';
  document.getElementById('cTitle').textContent = c.nombre || (c.tipo === 'negocio' ? 'Negocio de un habitante' : 'Casa de un habitante');
  document.getElementById('cWho').textContent = c.usuario || '';
  document.getElementById('cMeta').textContent = 'Construido el día ' + (c.dia || 1) + extra + (c.usuario && c.dia > 1 ? ' · de los 3 primeros de ese día' : (c.usuario ? ' · primera casa de la isla' : ''));
  document.getElementById('card').hidden = false;
}
function hide() { selected = null; document.getElementById('card').hidden = true; }
document.getElementById('close').addEventListener('click', hide);

resize(); construir(); requestAnimationFrame(frame);
fetch('isla.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => { if (d) { ISLA = d; construir(); encuadre(); } }).catch(() => {});
</script>
</body>
</html>
